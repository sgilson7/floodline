[package]
name = "net-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
net.workspace = true

# The mirror image of net-web: matchbox_socket is web-sys-based and macroquad
# never runs wasm-bindgen (design 9.1), so it must not follow us to wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
matchbox_socket.workspace = true
futures.workspace = true
