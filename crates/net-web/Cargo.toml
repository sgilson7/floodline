[package]
name = "net-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
net.workspace = true

# sapp-jsutils exists to talk to a page, and there is no page on a laptop.
# Keeping it target-gated is what lets `cargo test` build the whole workspace
# on the host: this crate compiles to an empty lib there instead of failing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
sapp-jsutils.workspace = true
