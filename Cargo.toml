[workspace]
resolver = "2"
members = [
    "crates/sim",
    "crates/net",
    "crates/net-web",
    "crates/gui",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
sim = { path = "crates/sim" }
net = { path = "crates/net" }
net-web = { path = "crates/net-web" }

serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
# Default features drag in heapless, which nothing here uses; `alloc` is what
# `to_allocvec` needs, and `to_allocvec` is what `checksum()` hashes.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
macroquad = "0.4.16"
sapp-jsutils = "0.1.7"

# Copied from perturbation-workbench, comment and all, because the reasoning is
# the part worth keeping.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# An integer overflow must not mean two different things in two builds.
#
# Rust checks overflow in debug and wraps in release. A headless `bot` peer is
# usually a debug native build and a browser peer is always a release wasm one,
# so without this an overflow anywhere in `sim` panics on one and silently
# wraps on the other — which is not a crash, it is a desync, and it is the
# hardest kind to find because the two peers disagree about arithmetic itself.
# On, a mistake is the same loud failure everywhere. Phase 2 item 4 profiles
# `tick()` against a 20 ms budget and will say whether the branch costs
# anything that matters.
overflow-checks = true
# Deliberately NOT panic = "abort": that compiles panics down to a bare
# `unreachable`, so a failure surfaces in the browser as
# "Unreachable code should not be executed" with no indication of what broke.
# A desync is exactly the bug that needs to say where it happened.

# Test binaries carry line tables and nothing else.
#
# Line tables keep file-and-line in panic messages, which is what a failing
# assertion actually needs; the rest of debuginfo is link time and disk for
# nobody. When a panic needs a full backtrace with arguments and locals, ask
# for one for that run and leave the profile alone:
#
#     CARGO_PROFILE_TEST_DEBUG=2 cargo test -p sim --test determinism
[profile.test]
debug = "line-tables-only"

# `sim` is optimised even under test.
#
# The water automaton is sixteen thousand cells of integer arithmetic every
# tick, and the flood tests run thousands of ticks across several seeds. Left
# unoptimised the suite took over two minutes, which is long enough that people
# stop running it — and a determinism test nobody runs is worse than none,
# because it looks like cover. Optimising only this one package keeps the test
# harness itself quick to compile.
#
# This does not weaken anything: `debug-assertions` and `overflow-checks` are
# independent of `opt-level` and stay on for tests, so the same panics fire.
[profile.test.package.sim]
opt-level = 2
