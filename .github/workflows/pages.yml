name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, mint a Pages deployment, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a superseded run is cancelled rather than queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The determinism and boundary tests are the whole reason `sim` is
      # written the way it is, and they need no browser. A failure here stops
      # the deploy rather than publishing a build that desyncs.
      - name: Test
        run: make test

      - name: Build the site
        run: make web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
